# This file is an nginx template. The official image runs envsubst over it at start-up and writes
# the result to /etc/nginx/conf.d/default.conf. Only TRUSTED_PROXY_CIDR is substituted
# (see NGINX_ENVSUBST_FILTER in the Dockerfile), every other $variable is left for nginx.

# Real client address behind nginx-proxy-manager.
# TRUSTED_PROXY_CIDR is the network the proxy connects from. The default in the Dockerfile is the
# Docker bridge range (172.16.0.0/12). Narrow it to the proxy network subnet if you know it.
set_real_ip_from ${TRUSTED_PROXY_CIDR};
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Rate limiting configuration
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=static:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=global:10m rate=20r/s;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

# Global request limits
client_body_buffer_size 1K;
client_header_buffer_size 1k;
large_client_header_buffers 4 8k;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Server performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 1M;  # Reduced for security

    # Connection limits
    limit_conn conn_limit_per_ip 10;

    # Hide server tokens
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/javascript
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # Security Headers (re-included in every location that sets its own add_header)
    include /etc/nginx/snippets/security-headers.conf;

    # Block obvious vulnerability scanners. Crawlers, link-preview bots and empty user agents are allowed.
    if ($http_user_agent ~* (sqlmap|nikto|masscan|zgrab|nmap)) {
        return 403;
    }

    # Server-side script and WordPress probes: this is a static site, none of these paths exist.
    # They answer with the plain text 404 below, never with the SPA shell.
    location ~* \.(php|jsp|cgi|asp|aspx)$ {
        return 404;
    }

    location ~* ^/(wp-admin|wp-content|wp-includes|wp-login\.php|xmlrpc\.php) {
        return 404;
    }

    # Dotfile probes (/.env, /.git/config, ...) get the plain text 404, never the SPA shell.
    # /.well-known/ is excluded so ACME and security.txt style requests keep their normal handling.
    location ~ /\.(?!well-known) {
        return 404;
    }

    # No sitemap is published, so a request for one gets the plain text 404 instead of the SPA shell
    location = /sitemap.xml {
        log_not_found off;
        return 404;
    }

    # No favicon is shipped yet, so a request for one gets the plain text 404 instead of the SPA shell.
    # The brand PR replaces this rule when a favicon ships.
    location = /favicon.ico {
        log_not_found off;
        return 404;
    }

    # Cache for static assets with rate limiting. A missing file is a real 404, not the SPA shell.
    # Cache-Control is set once here: `expires` would emit a second Cache-Control header.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|avif)$ {
        limit_req zone=static burst=50 nodelay;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable, no-transform";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        log_not_found off;
    }

    # The entry document must always be revalidated so deployments show up immediately.
    # An exact match beats the regex locations below, so it also covers the SPA fallback.
    location = /index.html {
        limit_req zone=api burst=10 nodelay;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Cache for other HTML files with rate limiting
    location ~* \.html$ {
        limit_req zone=static burst=20 nodelay;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Main location (SPA fallback) with rate limiting
    location / {
        limit_req zone=global burst=30 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint with stricter rate limiting.
    # No add_header here, so the server-level security headers are inherited.
    location = /health {
        limit_req zone=api burst=5 nodelay;
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Error pages. Unknown paths that look like routes are served index.html by `location /`,
    # so a 404 reaching this point is a genuinely missing file and gets a small text body.
    error_page 404 @not_found;
    error_page 429 =429 @rate_limit;

    location @not_found {
        # The content type is otherwise taken from the extension of the missing file (.js, .ico)
        types { }
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        return 404 "Not found\n";
    }

    location @rate_limit {
        default_type text/plain;
        add_header Retry-After "60";
        include /etc/nginx/snippets/security-headers.conf;
        return 429 "Rate limit exceeded. Please wait before trying again.\n";
    }
}
