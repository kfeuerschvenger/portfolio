# Security headers, shared by every location.
# nginx drops all inherited add_header directives as soon as a location defines its own,
# so each location that sets a header (cache control, for example) must include this file again.
#
# Fonts: index.css imports the stylesheet from fonts.googleapis.com and the font files are served
# from fonts.gstatic.com, so both origins are allowed below. Self-hosting the fonts would let
# style-src and font-src go back to 'self' only.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "no-referrer-when-downgrade" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https:;" always;
