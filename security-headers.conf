# Security headers, shared by every location.
# nginx drops all inherited add_header directives as soon as a location defines its own,
# so each location that sets a header (cache control, for example) must include this file again.
#
# Fonts: index.css imports the stylesheet from fonts.googleapis.com and the font files are served
# from fonts.gstatic.com, so both origins are allowed below. Self-hosting the fonts would let
# style-src and font-src go back to 'self' only.
# style-src keeps 'unsafe-inline' because React inline style props are applied as style attributes.
# img-src allows data: for assets Vite inlines. The app makes no cross-origin requests of its own.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer-when-downgrade" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;
