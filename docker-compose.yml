services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-kfeuerschvenger
    restart: unless-stopped
    networks:
      - nginx-proxy
    environment:
      # Network nginx-proxy-manager connects from, trusted for X-Forwarded-For (per-visitor rate limits)
      - TRUSTED_PROXY_CIDR=${TRUSTED_PROXY_CIDR:-172.16.0.0/12}
    # Uncomment to reach the site without the proxy, for example at http://localhost:8080
    # ports:
    #   - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  nginx-proxy:
    external: true
    # Required: name of the Docker network nginx-proxy-manager is attached to
    # (docker network ls). Export it or put it in an untracked .env file next to this one:
    #   PROXY_NETWORK=npm_default
    name: ${PROXY_NETWORK:?Set PROXY_NETWORK to the nginx-proxy-manager network name}
