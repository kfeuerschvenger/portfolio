<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browser frame</title>
    <style>
      /*
       * The window a raw screenshot is placed in. The capture script loads this
       * page, calls window.placeShot(...) with the screenshot as a data URL, and
       * screenshots the #stage element. Nothing here reads the network.
       *
       * The colours are the site's terminal palette: near black ground, green
       * for accents, amber and cyan as the secondary hues.
       */
      :root {
        --bg: #090a0c;
        --chrome: #0e1013;
        --chrome-edge: #1b3a1b;
        --green: #00ff00;
        --dim: #357d35;
        --amber: #ffbf00;
        --cyan: #00ffff;
        --pad: 88px;
        --mono: 'JetBrains Mono', 'Cascadia Mono', 'Fira Code', Consolas, 'Courier New', monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: var(--bg);
      }

      .stage {
        position: relative;
        display: inline-block;
        padding: var(--pad);
        overflow: hidden;
        background:
          radial-gradient(1100px 700px at 10% 6%, rgb(0 255 0 / 0.1), transparent 60%),
          radial-gradient(900px 600px at 96% 100%, rgb(0 255 255 / 0.07), transparent 65%),
          linear-gradient(135deg, #0b0d10 0%, #090a0c 55%, #060708 100%);
      }

      /* A faint grid behind the window, the hero section's motif. */
      .grid {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgb(0 255 0 / 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgb(0 255 0 / 0.045) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: radial-gradient(ellipse at center, transparent 35%, #000 100%);
        -webkit-mask-image: radial-gradient(ellipse at center, transparent 35%, #000 100%);
      }

      .window {
        position: relative;
        overflow: hidden;
        border-radius: 12px;
        background: var(--bg);
        box-shadow:
          0 0 0 1px var(--chrome-edge),
          0 0 40px -6px rgb(0 255 0 / 0.22),
          0 40px 80px -20px rgb(0 0 0 / 0.9);
      }

      .bar {
        display: flex;
        align-items: center;
        gap: 18px;
        height: 46px;
        padding: 0 18px;
        background: var(--chrome);
        border-bottom: 1px solid var(--chrome-edge);
      }

      .dots {
        display: flex;
        gap: 9px;
      }

      .dots i {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: var(--dim);
      }

      .dots i:nth-child(1) {
        background: var(--green);
        opacity: 0.85;
      }

      .dots i:nth-child(2) {
        background: var(--amber);
        opacity: 0.85;
      }

      .dots i:nth-child(3) {
        background: var(--cyan);
        opacity: 0.85;
      }

      .url {
        flex: 1;
        display: flex;
        justify-content: center;
        /* The same width as the dots, so the address sits in the middle of the bar. */
        margin-right: 61px;
      }

      .url span {
        min-width: 320px;
        max-width: 560px;
        padding: 5px 16px;
        overflow: hidden;
        border: 1px solid var(--chrome-edge);
        border-radius: 8px;
        background: #07080a;
        color: var(--dim);
        font: 500 13px/1.3 var(--mono);
        text-align: center;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .url span b {
        color: var(--green);
        font-weight: 600;
      }

      .window img {
        display: block;
        width: var(--shot-width, 1600px);
        height: auto;
      }

      /* The phone variant: a bezel instead of the browser bar. */
      .stage.phone .window {
        border-radius: 46px;
        border: 10px solid #15181c;
        box-shadow:
          0 0 0 1px var(--chrome-edge),
          0 0 40px -6px rgb(0 255 0 / 0.22),
          0 40px 80px -20px rgb(0 0 0 / 0.9);
      }

      .stage.phone .bar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="grid" aria-hidden="true"></div>
      <div class="window">
        <div class="bar">
          <div class="dots"><i></i><i></i><i></i></div>
          <div class="url"><span id="url"></span></div>
        </div>
        <img id="shot" alt="" />
      </div>
    </div>
    <script>
      /**
       * Puts a screenshot in the window.
       *
       * @param {{ src: string, width: number, url?: string, device?: 'browser' | 'phone' }} shot The image as a data URL, the width in CSS pixels it was taken at, the address to show and the kind of window.
       */
      window.placeShot = async ({ src, width, url, device }) => {
        document.documentElement.style.setProperty('--shot-width', `${width}px`);
        document.getElementById('stage').classList.toggle('phone', device === 'phone');

        const [host, ...rest] = (url || 'feuerschvenger.com').split('/');
        const address = document.getElementById('url');
        address.replaceChildren();
        const strong = document.createElement('b');
        strong.textContent = host;
        address.append(strong, rest.length > 0 ? `/${rest.join('/')}` : '');

        const image = document.getElementById('shot');
        image.src = src;
        await image.decode();
      };
    </script>
  </body>
</html>
